<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chatgpx</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">chat<strong>gpx</strong></span>
    <button id="logout-btn" class="link-btn" hidden>Log out</button>
  </header>

  <main>
    <!-- Login view -->
    <section id="login-view" class="view">
      <form id="login-form" class="card" autocomplete="off">
        <h1>Sign in with Komoot</h1>
        <p class="hint">
          Your password is used once to fetch your tours and is never stored
          or logged.
        </p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />

        <button type="submit" id="login-submit">Sync my activities</button>
        <p id="login-error" class="error" role="alert" hidden></p>
        <p id="login-status" class="status" hidden></p>
      </form>
    </section>

    <!-- Chat view -->
    <section id="chat-view" class="view" hidden>
      <p id="activity-summary" class="hint"></p>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="Ask about your rides…" required />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
